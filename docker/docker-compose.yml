# One stack per customer. Same image, different .env / region.
# India: ap-south-1. UAE: me-central-1.

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: pulse
      POSTGRES_PASSWORD: pulse
      POSTGRES_DB: pulse
    volumes:
      - pulse_pg:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pulse"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: ..
      dockerfile: docker/api.Dockerfile
    env_file: ../.env
    environment:
      DATABASE_URL: postgresql+psycopg://pulse:pulse@postgres:5432/pulse
      PYTHONPATH: /app/packages/foundation:/app/packages/canonical:/app/packages/ingest:/app/packages/rules:/app/apps/pulse:/app/apps/api
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8000:8000"

  worker:
    build:
      context: ..
      dockerfile: docker/api.Dockerfile
    command: python -m app.worker
    working_dir: /app/apps/api
    env_file: ../.env
    environment:
      DATABASE_URL: postgresql+psycopg://pulse:pulse@postgres:5432/pulse
      PYTHONPATH: /app/packages/foundation:/app/packages/canonical:/app/packages/ingest:/app/packages/rules:/app/apps/pulse:/app/apps/api
    depends_on:
      postgres:
        condition: service_healthy

  caddy:
    image: caddy:2-alpine
    profiles: ["tls"]
    ports:
      - "443:443"
      - "80:80"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      - api

volumes:
  pulse_pg:
