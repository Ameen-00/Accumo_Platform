# One stack per customer. Same image, different .env / region.
# India: ap-south-1. UAE: me-central-1.
# Local: API only on 127.0.0.1. Postgres is not published to the host.
# Never `docker push` this image. Never put a customer file in the build context.

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: pulse
      POSTGRES_PASSWORD: pulse
      POSTGRES_DB: pulse
    volumes:
      - pulse_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pulse"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  api:
    build:
      context: ..
      dockerfile: docker/api.Dockerfile
    env_file: ../.env
    environment:
      DATABASE_URL: postgresql+psycopg://pulse:pulse@postgres:5432/pulse
      PYTHONPATH: /app/packages/foundation:/app/packages/canonical:/app/packages/ingest:/app/packages/rules:/app/apps/pulse:/app/apps/api
      UPLOAD_DIR: /data/uploads
      REPORT_DIR: /data/reports
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - pulse_files:/data
    restart: unless-stopped

  worker:
    build:
      context: ..
      dockerfile: docker/api.Dockerfile
    command: python -m app.worker
    working_dir: /app/apps/api
    env_file: ../.env
    environment:
      DATABASE_URL: postgresql+psycopg://pulse:pulse@postgres:5432/pulse
      PYTHONPATH: /app/packages/foundation:/app/packages/canonical:/app/packages/ingest:/app/packages/rules:/app/apps/pulse:/app/apps/api
      UPLOAD_DIR: /data/uploads
      REPORT_DIR: /data/reports
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - pulse_files:/data
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    profiles: ["tls"]
    ports:
      - "127.0.0.1:443:443"
      - "127.0.0.1:80:80"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      - api

volumes:
  pulse_pg:
  pulse_files:
